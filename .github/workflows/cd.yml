name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      PORT: ${{ vars.PORT }}
      NODE_ENV: ${{ vars.NODE_ENV }}
      WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
      AUTH_SECRET: ${{ vars.AUTH_SECRET }}
      AI_SERVICE_URL: ${{ vars.AI_SERVICE_URL }}
      RAZORPAY_KEY_ID: ${{ vars.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ vars.RAZORPAY_KEY_SECRET }}
      RAZORPAY_WEBHOOK_SECRET: ${{ vars.RAZORPAY_WEBHOOK_SECRET }}
      RAZORPAY_EARLY_BIRD_PLAN_ID: ${{ vars.RAZORPAY_EARLY_BIRD_PLAN_ID }}
      RESEND_API_KEY: ${{ vars.RESEND_API_KEY }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      APP_URL: ${{ vars.APP_URL }}
      RAZORPAY_STARTER_PLAN_ID: ${{ vars.RAZORPAY_STARTER_PLAN_ID }}
      RAZORPAY_POPULAR_PLAN_ID: ${{ vars.RAZORPAY_POPULAR_PLAN_ID }}
      RAZORPAY_PRO_PLAN_ID: ${{ vars.RAZORPAY_PRO_PLAN_ID }}
  
    steps:
      - name: Pull Docker image
        run: sudo docker pull "${DOCKER_USERNAME}/${DOCKER_IMAGE_NAME}:latest"

      - name: Delete Old docker container
        run: |
          sudo docker rm -f "${DOCKER_IMAGE_NAME}-container" || true
          sudo docker network inspect "qri-network" >/dev/null 2>&1 || sudo docker network create "qri-network"

      - name: Run Docker Container
        run: |
          sudo docker run -d \
            --name "${DOCKER_IMAGE_NAME}-container" \
            --network "qri-network" \
            -p ${PORT}:${PORT} \
            --env "DATABASE_URL=${DATABASE_URL}" \
            --env "PORT=${PORT}" \
            --env "NODE_ENV=${NODE_ENV}" \
            --env "WEB_ORIGIN=${WEB_ORIGIN}" \
            --env "AUTH_SECRET=${AUTH_SECRET}" \
            --env "AI_SERVICE_URL=${AI_SERVICE_URL}" \
            --env "RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}" \
            --env "RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}" \
            --env "RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}" \
            --env "RAZORPAY_EARLY_BIRD_PLAN_ID=${RAZORPAY_EARLY_BIRD_PLAN_ID}" \
            --env "RESEND_API_KEY=${RESEND_API_KEY}" \
            --env "EMAIL_FROM=${EMAIL_FROM}" \
            --env "APP_URL=${APP_URL}" \
            --env "RAZORPAY_STARTER_PLAN_ID=${RAZORPAY_STARTER_PLAN_ID}" \
            --env "RAZORPAY_POPULAR_PLAN_ID=${RAZORPAY_POPULAR_PLAN_ID}" \
            --env "RAZORPAY_PRO_PLAN_ID=${RAZORPAY_PRO_PLAN_ID}" \
            "${DOCKER_USERNAME}/${DOCKER_IMAGE_NAME}:latest"
